function chart(data){const w=760,h=180,p=20,values=data.map(x=>x.close),lo=Math.min(...values),hi=Math.max(...values),pad=(hi-lo)*.15||1;const min=lo-pad,max=hi+pad;const points=values.map((v,i)=>[p+i/(values.length-1)*(w-p*2),h-p-(v-min)/(max-min)*(h-p*2)]);const line=points.map((a,i)=>(i?'L':'M')+a[0].toFixed(1)+','+a[1].toFixed(1)).join(' ');let grid='';for(let i=0;i<4;i++){const y=p+i/3*(h-p*2);grid+='<line x1="20" x2="740" y1="'+y+'" y2="'+y+'" stroke="#e7ede8" stroke-dasharray="3 5"/><text x="737" y="'+(y-5)+'" text-anchor="end" fill="#8f9b96" font-size="9">'+(max-i/3*(max-min)).toFixed(0)+'</text>'}return '<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="观察区间收盘价走势。首日'+esc(data[0].date)+'，末日'+esc(data.at(-1).date)+'。仅描述历史。"><defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#74a88b" stop-opacity=".20"/><stop offset="1" stop-color="#74a88b" stop-opacity="0"/></linearGradient></defs>'+grid+'<path d="'+line+' L'+points.at(-1)[0]+','+(h-p)+' L'+p+','+(h-p)+' Z" fill="url(#fill)"/><path d="'+line+'" fill="none" stroke="#3e8169" stroke-width="2"/><circle cx="'+points.at(-1)[0]+'" cy="'+points.at(-1)[1]+'" r="3.5" fill="#3e8169"/></svg>'}
function render(r){current=r;const demo=r.mode==='demo';$('#banner').className='banner'+(demo?'':' live');$('#banner').innerHTML=demo?'<b>构造演示场景 · 全部数据为合成样本 · 非真实行情</b><span>场景日期 '+esc(r.metric.date)+' · 不可用于实际市场判断</span>':'<b>'+esc(r.evidence[0].source)+'</b><span>完整日线截至 '+esc(r.metric.date)+' 15:00 · 当日未收盘数据已剔除</span>';$('#connectionText').textContent=demo?'演示环境':r.mode==='fuyao'?'扶摇数据连接':'公开日线连接';$('#aiStatus').textContent=r.ai.status==='已启用'?'模型归纳 · 引用已校验':'规则研究 · '+r.ai.status;
const m=r.metric;$('#results').innerHTML='<div class="grid"><div class="left"><section class="panel"><div class="statushero"><div class="hero-top"><span class="tag">'+esc(r.state)+'</span><small>解释置信度：'+esc(r.confidence)+' · 非涨跌概率</small></div><h2>'+esc(r.title)+'</h2><p class="hero-desc">'+esc(r.name)+' / '+esc(r.metric.chart[0].date)+' 至 '+esc(m.date)+' / '+r.days+'个完整交易日区间</p></div><div class="claims">'+r.claims.map(c=>'<div class="claim"><span class="tag '+(c.type==='事实'?'fact':c.type==='不确定'?'uncertain':'')+'">'+esc(c.type)+'</span><p>'+esc(c.text)+' '+refs(c.evidence_ids)+'</p></div>').join('')+'</div></section><section class="panel chart-panel"><div class="chart-title"><div><b>价格结构</b><p>'+esc(r.name)+' · 完整日线收盘价 · 单位：点</p></div><div class="chart-value"><b>'+m.last.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+'</b><small>区间变化 '+fmt(m.change)+'</small></div></div><div class="chart-wrap">'+chart(m.chart)+'</div><div class="chartcaption"><span>'+esc(m.chart[0].date)+'</span><span>'+esc(m.date)+' · '+(demo?'构造样本':'历史观察')+'</span></div><div class="metrics"><button class="metric" data-evidence="E2"><small>相对20日均线</small><strong>'+fmt(m.maGap)+'</strong><span>收盘价 / 均线偏离 E2 ↗</span></button><button class="metric" data-evidence="E3"><small>成交量比（代理）</small><strong>'+(m.volumeRatio===null?'缺失':m.volumeRatio.toFixed(2)+'×')+'</strong><span>近5日 / 此前20日 E3 ↗</span></button><button class="metric" data-evidence="E4"><small>已实现波动率</small><strong>'+m.volatility.toFixed(1)+'%</strong><span>年化风险代理 E4 ↗</span></button></div></section><section class="panel conditions"><div class="sectionhead"><span>什么条件会改变判断？</span><small>研究阈值 · 非预测</small></div>'+r.conditions.map((c,i)=>'<div class="condition"><span class="num">0'+(i+1)+'</span><div><b>'+esc(c.title)+'</b>'+refs(c.refs)+'<p>'+esc(c.detail)+'</p><small>'+esc(c.status)+'</small></div></div>').join('')+'</section></div><aside class="right"><section class="panel"><div class="sectionhead"><span>证据完整度</span><small>直接证据覆盖</small></div><div class="coverage"><strong>'+r.coverage+'<span> / 7</span></strong><p>市场维度已覆盖<br>代理指标不计入覆盖</p></div><div class="quality">'+r.quality.map(q=>'<div class="qualityrow" title="'+esc(q.note)+'"><span>'+esc(q.name)+'</span><span class="'+q.status+'">'+(q.status==='available'?'● 已覆盖':q.status==='proxy'?'◐ 仅代理':'○ 未获取')+'</span></div>').join('')+'</div><div class="qualitynote">'+esc(r.confidenceReason)+'</div></section><section class="panel"><div class="sectionhead"><span>风格横截面</span><small>同期区间变化</small></div><div class="styles">'+(r.styles.length?r.styles.map(s=>'<div class="stylerow"><div class="styletext"><span>'+esc(s.name)+'</span><strong>'+fmt(s.change)+'</strong></div><div class="styletrack"><i class="'+(s.change<0?'neg':'')+'" style="width:'+Math.min(100,Math.max(5,Math.abs(s.change)*8))+'%"></i></div></div>').join(''):'<p class="sub">比较数据缺失，暂停风格判断</p>')+'</div><div class="qualitynote">宽基指数仅为风格代理，不等于行业归因。'+(r.evidence.some(e=>e.id==='E5')?refs(['E5']):'')+'</div></section><section class="panel research"><div class="asktitle"><b>下一步研究</b><span class="tag">'+esc(r.plan.focus)+'</span></div><p>'+esc(r.research)+'</p><div class="chips"><button class="chip" data-question="哪些证据缺失，应该优先补齐什么？">补齐证据 ↗</button><button class="chip" data-question="哪些风险变量会让当前判断失效？">复核风险 ↗</button></div></section></aside></div><section class="panel evidence-panel" id="evidence"><div class="sectionhead"><span>支撑这次判断的证据</span><small>点击查看原始字段、来源与口径</small></div><div class="evidence-list">'+r.evidence.map(e=>'<button class="evidence-row" data-evidence="'+e.id+'"><span class="eid">'+e.id+'</span><span><b>'+esc(e.label)+'</b><small>'+esc(e.source)+' · '+esc(e.asOf)+' · '+esc(e.quality)+'</small></span><strong>'+esc(e.value)+' <small style="display:inline">'+esc(e.unit==='%'&&e.value.endsWith('%')?'':e.unit)+'</small></strong><span style="color:#8fa49a">↗</span></button>').join('')+'</div></section><section class="panel trace"><details><summary><span>研究计划与工具调用记录</span><span class="sub">'+r.logs.length+'次调用 · 可追溯</span></summary><ol>'+r.plan.tasks.map((t,i)=>'<li><b>0'+(i+1)+' '+esc(t.purpose)+'</b><br><code>'+esc(t.tool)+'</code> · '+esc(t.fields.join(' / '))+'</li>').join('')+'</ol><h4>实际调用结果</h4>'+r.logs.map(l=>'<p class="sub" style="margin:9px 0"><span class="'+(l.status==='success'?'available':'proxy')+'">'+(l.status==='success'?'✓':'!')+'</span> '+esc(l.tool)+' '+esc(l.index||'')+' · '+esc(l.source||'')+' '+esc(l.message||((l.count||'')+'根 / '+(l.asOf||'')))+' <small>'+esc(l.durationMs??'')+' ms</small></p>').join('')+'<p class="sub">模型：'+esc(r.ai.note)+'</p><h4>限制与未完成证据</h4>'+r.warnings.map(w=>'<p class="sub">• '+esc(w)+'</p>').join('')+'</details></section>';
}
async function run(question=''){if(busy)return;busy=true;$('#busy').classList.remove('hidden');$('#error').classList.add('hidden');$('#runBtn').disabled=true;$('#askBtn').disabled=true;$('#results').classList.add('loading');$('#status').textContent='制定研究计划 → 指数日线与完整市场分页 → 校验时点、缺失与官方原文 → 汇总证据…';selectedQuestion=question;try{const response=await fetch('/api/research',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({index:$('#index').value,days,mode:$('#mode').value,scenario:$('#scenario').value,question,...settings})});const r=await response.json();if(r.refused){$('#error').textContent=r.message;$('#error').classList.remove('hidden');$('#status').textContent='请求已被边界检查拦截，未调用行情或模型工具。';return}if(r.failed||r.error||!response.ok){current=null;$('#results').innerHTML='<section class="panel"><div class="empty"><b>证据不可用，研判已停止</b><p>'+esc(r.message||r.error)+'</p><button class="btn" id="retryBtn">重新取数</button>'+(r.logs?'<pre style="font-size:11px;white-space:pre-wrap">'+esc(JSON.stringify(r.logs,null,2))+'</pre>':'')+'</div></section>';throw new Error(r.message||r.error||'服务不可用')}render(r);$('#status').textContent=question?'已针对“'+question+'”重新取数并更新研究。':'研究已完成 · '+r.evidence.length+'条证据 · '+r.logs.filter(l=>l.status==='failed').length+'项调用失败';}catch(e){$('#error').textContent=e.message||'网络异常，请重试';$('#error').classList.remove('hidden');$('#status').textContent='没有生成新的有效结论。';if(current){current=null;$('#results').innerHTML='<section class="panel"><div class="empty">网络异常，旧结论已撤下。请重试。</div></section>'}}finally{busy=false;$('#busy').classList.add('hidden');$('#runBtn').disabled=false;$('#askBtn').disabled=false;$('#results').classList.remove('loading')}}
$('#controls').onsubmit=e=>{e.preventDefault();run()};$('#askForm').onsubmit=e=>{e.preventDefault();const q=$('#question').value.trim();if(q)run(q);else toast('请输入一个研究问题')};
document.addEventListener('click',e=>{const target=e.target.closest('button');if(!target)return;if(target.dataset.days){days=+target.dataset.days;document.querySelectorAll('[data-days]').forEach(b=>b.classList.toggle('selected',b===target))}if(target.dataset.evidence)showEvidence(target.dataset.evidence);if(target.dataset.question){$('#question').value=target.dataset.question;run(target.dataset.question)}if(target.dataset.scroll){document.querySelectorAll('.navbutton').forEach(b=>b.classList.remove('active'));target.classList.add('active');$('#'+target.dataset.scroll)?.scrollIntoView({behavior:'smooth'})}if(target.id==='retryBtn')run(selectedQuestion);if(target.dataset.restore)restore(target.dataset.restore);});
$('#mode').onchange=()=>{$('#scenarioLabel').classList.toggle('hidden',$('#mode').value!=='demo');$('#status').textContent='范围已更改，点击“生成研判”更新结果。'};
function showEvidence(id){if(!current)return;const e=current.evidence.find(e=>e.id===id);if(!e)return;const source=e.sourceUrl.startsWith('https://')?'<a href="'+esc(e.sourceUrl)+'" target="_blank" rel="noopener noreferrer">查看来源端点 ↗</a>':'构造数据生成器：src/engine.js → demoBars';modal(id+' · '+e.label,'<span class="tag">'+esc(e.quality)+'</span><h4>'+esc(e.value)+' '+esc(e.unit==='%'&&e.value.endsWith('%')?'':e.unit)+'</h4><p>所属维度：'+esc(e.domain)+'<br>数据时点：'+esc(e.asOf)+'<br>来源：'+esc(e.source)+'<br>'+source+'</p><h4>统计口径与计算公式</h4><p>'+esc(e.formula)+'</p><h4>解释</h4><p>'+esc(e.interpretation)+'</p><h4>原始字段 / 工具返回值</h4><pre>'+esc(JSON.stringify(e.raw,null,2))+'</pre><p>研究编号：'+esc(current.id)+'</p>')}
function showSettings(){modal('数据与模型连接','<p>凭证仅保存在当前页面内存中，经本产品服务端转发给指定供应商。刷新页面即清除，不写入浏览器存储、研究报告或代码仓库。</p><h4>扶摇金融数据 API</h4><p>优先数据源。<a href="https://fuyao.aicubes.cn/admin/" target="_blank" rel="noopener noreferrer">管理 API Key ↗</a>。未配置时，扶摇模式会明确报错。</p><label>扶摇 API Key<input id="fuyaoKey" type="password" autocomplete="off" placeholder="仅当前会话使用" value="'+esc(settings.fuyaoKey)+'"></label><h4>OpenAI 研究归纳（可选）</h4><p>使用 OpenAI Docs 所述结构化输出。开启后，研究问题与已取证字段会发送给 OpenAI，可能产生 API 费用；不发送数据凭证。未连接时明确显示规则研究。</p><label>OpenAI API Key<input id="openaiKey" type="password" autocomplete="off" placeholder="仅当前会话使用" value="'+esc(settings.openaiKey)+'"></label><label>模型名称<input id="modelName" value="'+esc(settings.model)+'" maxlength="80"></label><div class="settingsfoot"><button class="btn" id="clearKeys">清除凭证</button><button class="btn primary" id="applySettings">应用连接设置</button></div>');$('#applySettings').onclick=()=>{settings={fuyaoKey:$('#fuyaoKey').value.trim(),openaiKey:$('#openaiKey').value.trim(),model:$('#modelName').value.trim()||'gpt-4.1-mini'};$('#dialog').close();toast('已更新当前页面连接，下一次研究时生效')};$('#clearKeys').onclick=()=>{settings={fuyaoKey:'',openaiKey:'',model:'gpt-4.1-mini'};$('#dialog').close();toast('会话凭证已清除')}}
$('#settingsBtn').onclick=showSettings;$('#topSettings').onclick=showSettings;
function saved(){try{return JSON.parse(localStorage.getItem('market-lens-reports')||'[]')}catch{return []}}
function refreshRecent(){const list=saved().slice(0,3);$('#recent').innerHTML=list.length?list.map(r=>'<button class="recent" data-restore="'+esc(r.id)+'">'+esc(r.name)+' · '+r.days+'日<br><small>'+esc(r.mode==='demo'?'构造演示':r.metric.date)+'</small></button>').join(''):'<div class="recent">尚无保存的研究</div>'}
$('#saveBtn').onclick=()=>{if(!current||busy)return toast('请先完成一次有效研究');try{const reports=[current,...saved().filter(r=>r.id!==current.id)].slice(0,8);localStorage.setItem('market-lens-reports',JSON.stringify(reports));refreshRecent();toast('已保存至本浏览器研究记录（不含凭证）')}catch{toast('浏览器存储不可用，请导出报告')}};
function restore(id){const r=saved().find(r=>r.id===id);if(r){render(r);$('#index').value=r.index;days=r.days;$('#mode').value=r.mode;$('#scenario').value=r.scenario;$('#mode').onchange();document.querySelectorAll('[data-days]').forEach(b=>b.classList.toggle('selected',+b.dataset.days===days));$('#dialog').close();$('#status').textContent='已打开保存快照（未重新取数）· 生成时间 '+new Date(r.createdAt).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'});window.scrollTo({top:0,behavior:'smooth'})}}
$('#historyBtn').onclick=()=>{const list=saved();modal('本浏览器研究记录',list.length?list.map(r=>'<div class="archiveitem"><b>'+esc(r.name)+' · '+r.days+'日 · '+esc(r.mode==='demo'?'构造演示':'真实指数数据')+'</b><p>'+esc(r.state)+' · 保存快照生成于 '+new Date(r.createdAt).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'})+'</p><button class="btn" data-restore="'+esc(r.id)+'">打开快照</button></div>').join('')+'<div class="settingsfoot"><button class="btn" id="deleteHistory">清空本地记录</button></div>':'<p>还没有保存的研究。完成研究后，点击“保存研究”。</p>');if($('#deleteHistory'))$('#deleteHistory').onclick=()=>{localStorage.removeItem('market-lens-reports');refreshRecent();$('#dialog').close();toast('本浏览器记录已清空')}};
$('#exportBtn').onclick=()=>{if(!current||busy)return toast('请先完成一次有效研究');modal('导出可追溯研究报告','<p>报告包含结论、来源、时点、口径、原始字段、缺失项、切换条件和工具调用记录，不含凭证。</p><div class="settingsfoot"><button class="btn" id="exportJSON">完整 JSON 证据包</button><button class="btn primary" id="exportMD">Markdown 研究报告</button></div>');$('#exportJSON').onclick=()=>download(JSON.stringify(current,null,2),'json','application/json');$('#exportMD').onclick=()=>{const r=current;const md='# 观澜市场研究报告\n\n'+(r.mode==='demo'?'**构造演示，全部数据为合成样本，非真实行情。**\n\n':'')+'研究编号：'+r.id+'\n\n生成时间：'+r.createdAt+'\n\n问题：'+r.question+'\n\n## '+r.state+'\n\n'+r.title+'\n\n置信度：'+r.confidence+'。'+r.confidenceReason+'\n\n'+r.claims.map(c=>'- ['+c.type+'] '+c.text+' ['+c.evidence_ids.join(', ')+']').join('\n')+'\n\n## 状态切换条件\n\n'+r.conditions.map(c=>'- '+c.title+'：'+c.detail+'（'+c.status+'）').join('\n')+'\n\n## 证据与原始字段\n\n'+r.evidence.map(e=>'### '+e.id+' '+e.label+'\n\n值：'+e.value+' '+(e.unit==='%'&&e.value.endsWith('%')?'':e.unit)+'\n\n来源：'+e.source+' '+e.sourceUrl+'\n\n时点：'+e.asOf+'\n\n口径：'+e.formula+'\n\n```json\n'+JSON.stringify(e.raw,null,2)+'\n```').join('\n\n')+'\n\n## 覆盖与缺失\n\n'+r.quality.map(q=>'- '+q.name+'：'+q.note).join('\n')+'\n\n## 研究计划与工具记录\n\n```json\n'+JSON.stringify({plan:r.plan,logs:r.logs,ai:r.ai},null,2)+'\n```\n\n## 已知限制\n\n'+r.warnings.map(w=>'- '+w).join('\n');download(md,'md','text/markdown')}};
function download(content,ext,mime){const u=URL.createObjectURL(new Blob([content],{type:mime+';charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='观澜_'+current.name+'_'+current.metric.date+'.'+ext;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);$('#dialog').close();toast('报告已导出')}
$('#methodBtn').onclick=()=>modal('观澜如何理解市场','<h4>1. 先取证，再解释</h4><p>指定指数和5/20/60日区间，调用受限、可审计的指数工具。每次研究重新取数；不把接口异常包装成正常结论。完整日线剔除北京时间15:00前的当日数据。</p><h4>2. 七个维度，显式缺失</h4><p>行情结构、市场宽度、风格轮动、估值、流动性、情绪、重要事件。仅有代理时显示“仅代理”，不计入直接覆盖。宽基表现差只能反映指数间差异。</p><h4>3. 规则与AI各司其职</h4><p>区间变化、均线、量比与波动率由代码计算。大模型仅在连接后对工具结果做结构化归纳；输出需要通过引用、数字与边界检查。未配置或失败时明确显示规则模式。</p><h4>4. 置信度与状态切换</h4><p>置信度描述证据解释充分度，不是上涨概率。覆盖不足为低，覆盖4个维度以上为中；本版本不输出高置信度。状态阈值用于分层观察，未经过预测回测。</p><h4>5. 数据来源与边界</h4><p><a href="https://fuyao.aicubes.cn/docs/api-reference/a-share-index/" target="_blank" rel="noopener noreferrer">扶摇官方接口文档 ↗</a>。公开腾讯指数接口是可用性不受保证的备选，非正式授权合作。iFinD MCP未连接，未宣称已使用。</p><h4 id="demo">6. 演示数据</h4><p>演示数据是确定性函数生成的合成样本，日期不对应真实交易日历。市场宽度和估值亦为构造字段。仅用于检验交互、计算和异常处理，不能用于投资研究结论。</p><h4>7. 不提供投资指令</h4><p>不预测未来涨跌，不提供收益承诺、目标价、买卖或仓位建议。自动检查并非完备金融合规审查，研究者仍需复核解释和来源。</p>');
